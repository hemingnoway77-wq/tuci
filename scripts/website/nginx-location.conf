# Included only in the existing HTTPS server for 101.133.134.128.
# /tuci-sync/ and /tuci-updates/ retain their existing more-specific locations.
location / {
    root /srv/tuci-website/current;
    try_files $uri $uri/ =404;
    error_page 404 /_tuci_not_found;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    limit_except GET HEAD { deny all; }
}
location ^~ /assets/ {
    root /srv/tuci-website/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD { deny all; }
}
location = /_tuci_not_found {
    internal;
    alias /srv/tuci-website/current/404.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
