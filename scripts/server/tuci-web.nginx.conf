# Included inside the existing HTTPS IP server; no new listener.
location = /tuci { return 301 /tuci/; }
location ^~ /tuci/ {
    root /srv/tuci-web/current;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Service-Worker-Allowed /tuci/ always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; media-src 'self' https://api.dictionaryapi.dev https://ssl.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; frame-ancestors 'none'" always;
    limit_except GET HEAD { deny all; }
    location ~ ^/tuci/dictionary/[a-z]\.jsonl$ {
        try_files $uri =404;
        types { application/x-ndjson jsonl; }
        gzip on;
        gzip_types application/x-ndjson;
        gzip_vary on;
    }
}
