# Included inside the existing HTTPS server for 101.133.134.128.
location = /tuci-updates/stable.json {
    alias /srv/tuci-updates/public/stable.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD { deny all; }
}
location ^~ /tuci-updates/packages/ {
    alias /srv/tuci-updates/public/packages/;
    autoindex off;
    default_type application/zip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD { deny all; }
}
location /tuci-updates/ { return 404; }
