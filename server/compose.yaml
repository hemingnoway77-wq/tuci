services:
  sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    volumes:
      - tuci_data:/data
    expose:
      - "8080"
  https:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - sync
    environment:
      TUCI_HOST: ${TUCI_HOST:?设置指向服务器的域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tuci_data:
  caddy_data:
  caddy_config:
