<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-TUwm6L6gj2DHzVAUAkmKy7aTKvLP5m+kc/BCFkyN3n4='; style-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <title>更新兔词</title>
  <style>
    :root{color-scheme:light;font-family:"Iowan Old Style","Songti SC","STSong","SimSun",serif;background:#f7f7f7;color:#222;-webkit-text-size-adjust:100%}
    body{margin:0;padding:calc(40px + env(safe-area-inset-top)) 24px;line-height:1.7}
    main{max-width:420px;margin:10vh auto;background:#fff;border:1px solid #d4d4d4;border-radius:12px;padding:28px}
    h1{font-size:1.8rem;line-height:1.3;margin:0 0 20px}p{margin:12px 0}.hint{font-size:.94rem;color:#666}
    .actions{display:flex;align-items:center;gap:20px;margin-top:24px}button,a{font:inherit;min-height:44px;display:inline-flex;align-items:center}
    button{background:#262626;color:#fff;border:0;border-radius:8px;padding:8px 20px;cursor:pointer}a{color:#262626;text-underline-offset:.2em}[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <h1>更新兔词</h1>
    <p id="status" role="status" aria-live="polite">正在获取最新版本…</p>
    <p class="hint">词库与设置会保留。更新完成后自动返回。</p>
    <div class="actions"><button id="retry" hidden>重试</button><a href="./">回到兔词</a></div>
  </main>
  <script>
const status = document.querySelector('#status');
const retry = document.querySelector('#retry');
function activated(worker) {
  return new Promise((resolve, reject) => {
    const finish = error => {
      clearTimeout(timer);
      worker.removeEventListener('statechange', check);
      error ? reject(error) : resolve();
    };
    const check = () => {
      if (worker.state === 'activated') finish();
      else if (worker.state === 'redundant') finish(new Error('Update did not install'));
    };
    const timer = setTimeout(() => finish(new Error('Update timed out')), 60000);
    worker.addEventListener('statechange', check);
    check();
  });
}
async function update() {
  retry.hidden = true;
  status.textContent = '正在获取最新版本…';
  try {
    if (!('serviceWorker' in navigator)) throw new Error('Offline support unavailable');
    const registration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
    let candidate = registration.installing || registration.waiting;
    const remember = () => { candidate = registration.installing || registration.waiting || candidate; };
    registration.addEventListener('updatefound', remember);
    try {
      await registration.update();
      remember();
      const worker = candidate || registration.active;
      if (!worker) throw new Error('No installed version');
      await activated(worker);
    } finally {
      registration.removeEventListener('updatefound', remember);
    }
    location.replace('./');
  } catch {
    status.textContent = '更新未完成，请保持联网后重试。';
    retry.hidden = false;
  }
}
retry.addEventListener('click', update);
update();
  </script>
</body>
</html>
